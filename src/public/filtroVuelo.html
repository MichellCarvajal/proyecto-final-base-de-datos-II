<div class="w-full bg-white p-6">

    <form id="form-vuelos">

        <div class="flex gap-8 mb-5 text-gray-700">
            <label class="flex items-center gap-2 cursor-pointer">
                <input type="radio" name="tipoViaje" value="ida_vuelta" checked>
                <span>Ida y Vuelta</span>
            </label>

            <label class="flex items-center gap-2 cursor-pointer">
                <input type="radio" name="tipoViaje" value="solo_ida">
                <span>Solo Ida</span>
            </label>

            <span class="text-gray-300 text-2xl">|</span>

            <div>
                <select name="categoria" id="select-categoria" class="bg-white border border-gray-300 rounded-lg p-2">
                    <option value="economica">economica</option>
                    <option value="premium">premium</option>
                </select>
            </div>
        </div>

        <div class="flex gap-4 relative">

            <div class="flex items-center w-[250px] h-[65px] border rounded px-4 bg-white">
                <i class="fa-solid fa-location-dot text-gray-600 mr-3"></i>
                <div>
                    <p class="text-sm text-gray-500">Origen</p>
                    <input type="text" id="input-origen" name="origen" placeholder="¿Desde dónde viajas?" required>
                </div>
            </div>

            <button id="btn-intercambiar" type="button" class="absolute left-[233px] top-[10px]
                bg-white border rounded-full w-[45px] h-[45px]
                flex items-center justify-center text-blue-600 text-xl shadow">
                <i class="fa-solid fa-right-left"></i>
            </button>

            <div class="flex items-center w-[250px] h-[65px] border rounded px-4 bg-white">
                <i class="fa-solid fa-location-dot text-gray-600 mr-3"></i>
                <div>
                    <p class="text-sm text-gray-500">Destino</p>
                    <input type="text" id="input-destino" name="destino" placeholder="¿A dónde viajas?" required>
                </div>
            </div>

            <div class="border rounded-lg h-[65px] p-3 flex flex-col justify-center">
                <label class="text-xs text-gray-500">Salida</label>
                <div class="flex items-center gap-2">
                    <input type="date" id="input-fecha-salida" name="fechaSalida" class="w-full outline-none" required>
                </div>
            </div>

            <div id="div-fecha-regreso" class="border rounded-lg h-[65px] p-3 flex flex-col justify-center">
                <label class="text-xs text-gray-500">Regreso</label>
                <div class="flex items-center gap-2">
                    <input type="date" id="input-fecha-regreso" name="fechaRegreso" class="w-full outline-none">
                </div>
            </div>

            <div class="border rounded-lg h-[65px] p-3 flex flex-col justify-center cursor-pointer">
                <label class="text-xs text-gray-500">Viajeros</label>
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-user text-gray-600"></i>
                    <input type="number" id="input-viajeros" name="viajeros" min="1" value="1" class="w-[80px]" required>
                </div>
            </div>

            <div class="flex items-center justify-end">
                <button type="submit" class="w-[150px] h-[65px] bg-yellow-400 text-black font-bold rounded-lg">
                    Buscar Vuelos
                </button>
            </div>

        </div>

    </form>



</div>

<!-- Contenedor de resultados -->
<div id="vuelos-resultados" class="mt-10 w-full"></div>
