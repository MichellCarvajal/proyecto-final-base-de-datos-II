<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C&M travels</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <!--banner-->
    <div class="w-screen h-[70px] bg-blue-500 text-white font-bold text-2xl pl-5 flex items-center">C&M travels</div>

    <!--fondo de la pagina-->
    <div class="bg-gray-100 w-screen h-lvh flex justify-center">

        <!--contenedor del login-->
        <div class="bg-white w-[500px] h-[400px] mt-[90px] border border-gray-300 rounded-lg">

            <!--Iniciar sesión-->
            <div class="w-[500px] h-auto pt-4 text-center text-3xl font-bold text-gray-800">Iniciar Sesión</div>

            <!--contenedor del formulario para el login-->
            <div class=" w-[500px] h-auto pl-[100px]">

                <!--formulario login-->
                <form action="" id="form-login" class="flex flex-col space-y-4 w-[280px] items-center mt-[20px]">
                    <input type="email" id="email-login" required placeholder="Email" class="w-[280px] h-[30px] mb-[20px] p-5 border border-gray-500 border-2 rounded-xl">
                    <input type="password" id="password-login" required placeholder="Contraseña" class="w-[280px] h-[30px] p-5 border border-gray-500 border-2 rounded-xl">
                    <br>
                    <button class="bg-blue-500 h-[40px] rounded-xl w-[280px] text-white">Iniciar Sesion</button>

                    <p class="text-center ">¿aún no tienes cuenta?</p>

                    <button id="btn-register" class="border border-blue-500 border-2 h-[40px] rounded-xl w-[280px]">Registrarte</button>
                </form>
            </div>
        </div>
    </div>
    <script type="module" src="./js/api.js"></script>
    <script type="module" src="./js/login.js"></script>
</body>
</html>
