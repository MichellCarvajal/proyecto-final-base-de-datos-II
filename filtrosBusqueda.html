<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C&M travels</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/main.js" type="module" defer></script>
</head>
<body>
    <!--banner-->
    <div>
        <div class="w-screen h-[70px] bg-blue-500 flex items-center justify-between px-5 border-b-2 border-b-gray-200">
        
            <!-- Texto izquierda -->
            <div class="text-white font-bold text-2xl">
                C&M travels
            </div>

            <!-- Iconos derecha -->
            <div class="flex gap-5 text-white text-2xl">
                <i class="fa-solid fa-cart-shopping"></i>
                <i class="fa-solid fa-circle-user"></i> 
            </div>
        </div>
        
        <!--banner azul-->
        <div class="bg-blue-500 w-screen h-[300px]"></div>
    </div>
    
    <!--fondo pagina-->
    <div class="bg-gray-900 w-screen h-lvh relative">
    </div>
    
    <!--contenedor filtros-->
    <div class="bg-white w-[1250px] h-[180px] absolute top-[200px] left-[140px] rounded-xl">

         <!-- pestañas -->
        <div class="bg-gray-100 h-[50px] flex items-center gap-5 border-b border-gray-500 pl-5 rounded-t-xl">
            <button class="tab-btn text-gray-800 font-semibold pb-2" id="boton-vuelos">
                Vuelos
            </button>
            <button class="tab-btn text-gray-800 font-semibold pb-2" id="boton-hoteles">
                Hoteles
            </button>
            <button class="tab-btn text-gray-800 font-semibold pb-2" id="boton-paquetes">
                Vuelos + Hoteles
            </button>
        </div>

         <!-- contenido-->
        <div class="bg-white w-[1250px] h-[180px] rounded-xl" id="contenido-pestaña">

        </div>
    </div>

</body>
</html>
